[package]
name = "ImageProcessingPipeline"

[package.build]
backend = { name = "pixi-build-python", version = "0.*" }

[package.host-dependencies]
hatchling = "*"

[workspace]
authors = ["Kevin Kleibeck <kekleinbeck@gmail.com>", "Emma Crean <Emma.Crean@tum.de>"]
channels = ["conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]
version = "0.1.0"

[tasks]
# Code Quality
lint       = { default-environment = "dev",  cmd = "ruff check --fix" }
typecheck  = { default-environment = "dev",  cmd = "ty check" }
# Documentation
docs-create-references = { default-environment = "docs", cmd = "python ./docs/src/gen_pages.py" }
docs       = { default-environment = "docs", cmd = "zensical build", depends-on=["docs-create-references"] }
docs-serve = { default-environment = "docs", cmd = "zensical serve", depends-on=["docs-create-references"] }
# Testing
test       = { default-environment = "dev",  cmd = "pytest" }
unit       = { default-environment = "dev",  cmd = "pytest -m unit" }

[pypi-dependencies]
image_processing_pipeline = { path = ".", editable = true }

[environments]
default = { solve-group = "default" }

[environments.dev]
solve-group = "default"

[environments.dev.dependencies]
pytest = ">=9.1.1,<10"
jupyter = ">=1.1.1,<2"
jinja2 = ">=3.1.6,<4"
ruff = ">=0.16.5,<0.17"
ty = ">=0.0.77,<0.0.78"
pre-commit = ">=4.6.2,<5"

[environments.docs.dependencies]
zensical = ">=0.0.57,<0.0.58"
mkdocs-gen-files = ">=0.6.1,<0.7"

[environments.docs.pypi-dependencies]
mkdocstrings = ">=1.0.6, <2"
mkdocs-api-autonav = ">=0.4.0, <0.5"
