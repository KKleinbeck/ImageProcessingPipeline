# Project Information
site_name: ImageProcessingPipeline Documentation
repo_url: http://TODO

# Build Directories
theme: readthedocs
docs_dir: docs/src
site_dir: docs/build

# Plugins
plugins:
- search
- mkdocstrings:
    handlers:
        python:
            inventories:
                - https://docs.python.org/3/objects.inv
            options:
                docstring_section_style: list # or "table"
                docstring_style: "numpy"
                filters: [] # ["!^_"]
                heading_level: 1
                merge_init_into_class: true
                parameter_headings: true
                separate_signature: true
                show_root_heading: true
                show_signature_annotations: true
                show_symbol_type_heading: true
                show_symbol_type_toc: true
                summary: true
- api-autonav:
    modules: ["src/image_processing_pipeline"]
    module_options:
        package.submodule:
            docstring_style: numpy
